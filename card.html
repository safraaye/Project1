<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" initial-scale="1.0" />
    <title>Responsive Profile Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">
            <img 
            src="asset/degan.png" 
            alt="Profile Picture"
            class="w-24 h-24 rounded-full  mx-auto"
            />
            <h1 class="text-2xl font-bold text-center mt-2">Sacad Mohamed</h1>
            <p class="text-gray-600 text-center mt-4"> Helpdesk </p>

            <div class="flex flex-wrap justify-center gap-2 mt-6">
                <span class="px-3 py-1 bg-gray-100 rounded-full">HTML</span>
                <span class="px-3 py-1 bg-gray-100 rounded-full">CSS</span>
                <span class="px-3 py-1 bg-gray-100 rounded-full">JavaScript</span>
            </div>

            <button class="w-full mt-6 py-3 bg-black text-white rounded-lg"> Contact Me</button>
        </div>
    </main>
  </body>
  </html>
